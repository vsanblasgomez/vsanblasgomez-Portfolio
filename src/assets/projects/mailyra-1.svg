<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0a"/>
      <stop offset="1" stop-color="#0f0a08"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg1)"/>
  <rect x="40" y="40" width="1120" height="670" rx="20" fill="#15110d" stroke="#2a1f17" stroke-width="1"/>

  <!-- Sidebar -->
  <rect x="40" y="40" width="240" height="670" rx="20" fill="#1c1612"/>
  <rect x="72" y="92" width="120" height="14" rx="3" fill="#f97316"/>
  <rect x="72" y="112" width="80" height="8" rx="2" fill="#6b5b50"/>
  <g font-family="Inter, sans-serif" font-size="13" fill="#9c8b80">
    <rect x="56" y="170" width="208" height="36" rx="8" fill="#2a1f17"/>
    <text x="84" y="193" fill="#f97316">Inbox</text>
    <circle cx="244" cy="188" r="10" fill="#dc2626"/>
    <text x="244" y="192" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">12</text>
    <text x="84" y="233">Sent</text>
    <text x="84" y="273">Drafts</text>
    <text x="84" y="313">Starred</text>
    <text x="84" y="353">Archive</text>
    <text x="84" y="393">Trash</text>
  </g>
  <rect x="56" y="640" width="208" height="44" rx="10" fill="url(#accent1)"/>
  <text x="160" y="668" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a0f0a">+ New message</text>

  <!-- Topbar -->
  <rect x="296" y="40" width="864" height="60" fill="#1c1612"/>
  <text x="324" y="78" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="600" fill="#fef3c7">Inbox</text>
  <rect x="1000" y="56" width="140" height="28" rx="14" fill="#2a1f17"/>
  <text x="1070" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#9c8b80">Search emails</text>

  <!-- Email rows -->
  <g font-family="Inter, sans-serif">
    <!-- Row 1 (unread) -->
    <rect x="296" y="100" width="864" height="76" fill="#221912"/>
    <rect x="296" y="100" width="4" height="76" fill="#f97316"/>
    <circle cx="340" cy="138" r="18" fill="#dc2626"/>
    <text x="340" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">AM</text>
    <text x="380" y="130" font-size="14" font-weight="600" fill="#fef3c7">Acme Corp — Q3 report ready for review</text>
    <text x="380" y="152" font-size="12" fill="#9c8b80">Hi Victor, attached is the quarterly report we discussed. Please review section 4...</text>
    <text x="1130" y="130" text-anchor="end" font-size="11" fill="#f97316" font-weight="600">9:42 AM</text>

    <!-- Row 2 -->
    <rect x="296" y="176" width="864" height="76" fill="#1a1410"/>
    <circle cx="340" cy="214" r="18" fill="#fbbf24"/>
    <text x="340" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#1a0f0a">JS</text>
    <text x="380" y="206" font-size="14" font-weight="600" fill="#fef3c7">Jane Smith</text>
    <text x="380" y="228" font-size="12" fill="#9c8b80">Re: Onboarding timeline — confirmation needed by Friday</text>
    <text x="1130" y="206" text-anchor="end" font-size="11" fill="#6b5b50">Yesterday</text>

    <!-- Row 3 -->
    <rect x="296" y="252" width="864" height="76" fill="#1a1410"/>
    <circle cx="340" cy="290" r="18" fill="#7c3aed"/>
    <text x="340" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MK</text>
    <text x="380" y="282" font-size="14" font-weight="600" fill="#fef3c7">Marketing weekly digest · 14 threads</text>
    <text x="380" y="304" font-size="12" fill="#9c8b80">Your top performing campaign this week reached 12.4k recipients...</text>
    <text x="1130" y="282" text-anchor="end" font-size="11" fill="#6b5b50">Mon</text>

    <!-- Row 4 -->
    <rect x="296" y="328" width="864" height="76" fill="#1a1410"/>
    <circle cx="340" cy="366" r="18" fill="#059669"/>
    <text x="340" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DS</text>
    <text x="380" y="358" font-size="14" font-weight="600" fill="#fef3c7">Dots Memories — sprint planning notes</text>
    <text x="380" y="380" font-size="12" fill="#9c8b80">Updated board for sprint 24. Two new tickets assigned to front-end team...</text>
    <text x="1130" y="358" text-anchor="end" font-size="11" fill="#6b5b50">Mon</text>

    <!-- Row 5 -->
    <rect x="296" y="404" width="864" height="76" fill="#1a1410"/>
    <circle cx="340" cy="442" r="18" fill="#0891b2"/>
    <text x="340" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PB</text>
    <text x="380" y="434" font-size="14" font-weight="600" fill="#fef3c7">Pablo B. — Invoice #2024-118</text>
    <text x="380" y="456" font-size="12" fill="#9c8b80">Attached invoice for services rendered. Payment terms 30 days...</text>
    <text x="1130" y="434" text-anchor="end" font-size="11" fill="#6b5b50">Sun</text>

    <!-- Row 6 -->
    <rect x="296" y="480" width="864" height="76" fill="#1a1410"/>
    <circle cx="340" cy="518" r="18" fill="#ea580c"/>
    <text x="340" y="523" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">GH</text>
    <text x="380" y="510" font-size="14" font-weight="600" fill="#fef3c7">GitHub — 3 new PRs to review</text>
    <text x="380" y="532" font-size="12" fill="#9c8b80">carol-dev opened pull request #482: Refactor auth flow...</text>
    <text x="1130" y="510" text-anchor="end" font-size="11" fill="#6b5b50">Sat</text>

    <!-- Row 7 -->
    <rect x="296" y="556" width="864" height="76" fill="#1a1410"/>
    <circle cx="340" cy="594" r="18" fill="#a16207"/>
    <text x="340" y="599" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">NR</text>
    <text x="380" y="586" font-size="14" font-weight="600" fill="#fef3c7">Newsletter — Frontend Focus #612</text>
    <text x="380" y="608" font-size="12" fill="#9c8b80">React 19 stable release, new CSS features, performance tips...</text>
    <text x="1130" y="586" text-anchor="end" font-size="11" fill="#6b5b50">Fri</text>
  </g>
</svg>
