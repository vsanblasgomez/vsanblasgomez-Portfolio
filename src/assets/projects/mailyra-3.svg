<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0a"/>
      <stop offset="1" stop-color="#0f0a08"/>
    </linearGradient>
    <linearGradient id="orangeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg3)"/>
  <rect x="40" y="40" width="1120" height="670" rx="20" fill="#15110d" stroke="#2a1f17" stroke-width="1"/>

  <!-- Header -->
  <rect x="40" y="40" width="1120" height="80" fill="#1c1612"/>
  <text x="80" y="88" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="700" fill="#fef3c7">Mailyra</text>
  <rect x="220" y="68" width="160" height="28" rx="14" fill="#2a1f17"/>
  <text x="300" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#9c8b80">Last 30 days</text>
  <circle cx="1100" cy="82" r="20" fill="#f97316"/>
  <text x="1100" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">VS</text>

  <!-- KPI cards row -->
  <g font-family="Inter, sans-serif">
    <rect x="80" y="156" width="248" height="120" rx="14" fill="#1a1410" stroke="#2a1f17"/>
    <text x="100" y="186" font-size="12" fill="#9c8b80">Inbox throughput</text>
    <text x="100" y="226" font-size="28" font-weight="700" fill="#fef3c7">12,847</text>
    <text x="100" y="252" font-size="11" fill="#10b981">▲ 23.4% vs last month</text>
    <rect x="280" y="232" width="32" height="22" rx="4" fill="url(#emerald)" fill-opacity="0.2"/>
    <text x="296" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#10b981">↗</text>

    <rect x="344" y="156" width="248" height="120" rx="14" fill="#1a1410" stroke="#2a1f17"/>
    <text x="364" y="186" font-size="12" fill="#9c8b80">Avg. response time</text>
    <text x="364" y="226" font-size="28" font-weight="700" fill="#fef3c7">1h 42m</text>
    <text x="364" y="252" font-size="11" fill="#10b981">▼ 18% faster</text>

    <rect x="608" y="156" width="248" height="120" rx="14" fill="#1a1410" stroke="#2a1f17"/>
    <text x="628" y="186" font-size="12" fill="#9c8b80">Auto-triaged by AI</text>
    <text x="628" y="226" font-size="28" font-weight="700" fill="#fef3c7">68%</text>
    <text x="628" y="252" font-size="11" fill="#fbbf24">▲ 12pp vs last month</text>

    <rect x="872" y="156" width="248" height="120" rx="14" fill="#1a1410" stroke="#2a1f17"/>
    <text x="892" y="186" font-size="12" fill="#9c8b80">Inbox zero rate</text>
    <text x="892" y="226" font-size="28" font-weight="700" fill="#fef3c7">94%</text>
    <text x="892" y="252" font-size="11" fill="#10b981">▲ 4.1pp</text>
  </g>

  <!-- Chart panel -->
  <rect x="80" y="296" width="688" height="394" rx="14" fill="#1a1410" stroke="#2a1f17"/>
  <text x="100" y="328" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600" fill="#fef3c7">Email volume by hour</text>
  <text x="100" y="348" font-family="Inter, sans-serif" font-size="11" fill="#6b5b50">Mon — Sun · hourly distribution</text>

  <!-- Grid lines -->
  <g stroke="#2a1f17" stroke-width="1">
    <line x1="100" y1="400" x2="748" y2="400"/>
    <line x1="100" y1="450" x2="748" y2="450"/>
    <line x1="100" y1="500" x2="748" y2="500"/>
    <line x1="100" y1="550" x2="748" y2="550"/>
    <line x1="100" y1="600" x2="748" y2="600"/>
    <line x1="100" y1="650" x2="748" y2="650"/>
  </g>

  <!-- Bars (Mon) -->
  <g>
    <rect x="112" y="500" width="22" height="160" rx="3" fill="url(#orangeRed)"/>
    <rect x="138" y="540" width="22" height="120" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="164" y="380" width="22" height="280" rx="3" fill="url(#orangeRed)"/>
    <rect x="190" y="420" width="22" height="240" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="216" y="460" width="22" height="200" rx="3" fill="url(#orangeRed)"/>
    <rect x="242" y="500" width="22" height="160" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="268" y="540" width="22" height="120" rx="3" fill="url(#orangeRed)"/>
    <rect x="294" y="580" width="22" height="80" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="320" y="500" width="22" height="160" rx="3" fill="url(#orangeRed)"/>
    <rect x="346" y="460" width="22" height="200" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="372" y="420" width="22" height="240" rx="3" fill="url(#orangeRed)"/>
    <rect x="398" y="380" width="22" height="280" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="424" y="420" width="22" height="240" rx="3" fill="url(#orangeRed)"/>
    <rect x="450" y="500" width="22" height="160" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="476" y="460" width="22" height="200" rx="3" fill="url(#orangeRed)"/>
    <rect x="502" y="420" width="22" height="240" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="528" y="500" width="22" height="160" rx="3" fill="url(#orangeRed)"/>
    <rect x="554" y="540" width="22" height="120" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="580" y="580" width="22" height="80" rx="3" fill="url(#orangeRed)"/>
    <rect x="606" y="600" width="22" height="60" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="632" y="540" width="22" height="120" rx="3" fill="url(#orangeRed)"/>
    <rect x="658" y="500" width="22" height="160" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
    <rect x="684" y="540" width="22" height="120" rx="3" fill="url(#orangeRed)"/>
    <rect x="710" y="580" width="22" height="80" rx="3" fill="url(#orangeRed)" fill-opacity="0.5"/>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="10" fill="#6b5b50">
    <text x="120" y="670">0h</text>
    <text x="312" y="670">6h</text>
    <text x="516" y="670">12h</text>
    <text x="708" y="670">18h</text>
  </g>

  <!-- Right panel: AI insights -->
  <rect x="788" y="296" width="332" height="394" rx="14" fill="#1a1410" stroke="#2a1f17"/>
  <text x="808" y="328" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600" fill="#fef3c7">AI insights</text>
  <text x="808" y="348" font-family="Inter, sans-serif" font-size="11" fill="#6b5b50">Generated from your inbox patterns</text>

  <g>
    <rect x="808" y="372" width="292" height="76" rx="10" fill="#221912" stroke="#f97316" stroke-opacity="0.3"/>
    <circle cx="830" cy="396" r="10" fill="url(#orangeRed)"/>
    <text x="830" y="400" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">!</text>
    <text x="852" y="394" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">3 invoices pending review</text>
    <text x="852" y="414" font-family="Inter, sans-serif" font-size="11" fill="#9c8b80">Detected in latest emails. Estimated total: €4,820.</text>
    <text x="852" y="432" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f97316">Review now →</text>

    <rect x="808" y="460" width="292" height="76" rx="10" fill="#221912" stroke="#fbbf24" stroke-opacity="0.3"/>
    <circle cx="830" cy="484" r="10" fill="url(#amber)"/>
    <text x="830" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#1a0f0a">⏱</text>
    <text x="852" y="482" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">Schedule a focus block</text>
    <text x="852" y="502" font-family="Inter, sans-serif" font-size="11" fill="#9c8b80">Tuesdays 10–12h are your lowest-volume windows.</text>
    <text x="852" y="520" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">Block calendar →</text>

    <rect x="808" y="548" width="292" height="76" rx="10" fill="#221912" stroke="#10b981" stroke-opacity="0.3"/>
    <circle cx="830" cy="572" r="10" fill="url(#emerald)"/>
    <text x="830" y="576" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">✓</text>
    <text x="852" y="574" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">Unsubscribe candidates: 7</text>
    <text x="852" y="594" font-family="Inter, sans-serif" font-size="11" fill="#9c8b80">Low-engagement newsletters from the last 30 days.</text>
    <text x="852" y="612" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10b981">See list →</text>
  </g>
</svg>
